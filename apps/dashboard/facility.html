<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verity Care — Facility Operator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/static/nav.js" defer></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
    .pill-red    { background: #fee2e2; color: #991b1b; }
    .pill-yellow { background: #fef3c7; color: #92400e; }
    .pill-green  { background: #dcfce7; color: #166534; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    @keyframes pulse-slow { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
    .pulse { animation: pulse-slow 1.4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen" x-data="facility()" x-init="init()">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <div>
        <div class="text-xs tracking-wider text-slate-500 uppercase">Verity Care</div>
        <div class="text-xl font-semibold">Facility Operator</div>
      </div>
      <div class="flex items-center gap-4">
        <select x-model="selected" @change="onFacilityChange()"
                class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white">
          <template x-for="f in facilities" :key="f.id">
            <option :value="f.id" x-text="f.name"></option>
          </template>
        </select>
        <span class="text-xs text-slate-500">
          on-chain: <span x-text="chain.chain || 'offline'" :class="chain.ok ? 'text-green-700 font-medium' : 'text-red-600'"></span>
        </span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-6 py-6 space-y-6">
    <!-- Upload card -->
    <section class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
      <div class="flex items-start justify-between mb-4">
        <div>
          <h2 class="text-lg font-semibold">Monthly inventory snapshot</h2>
          <p class="text-sm text-slate-600">
            Upload your pharmacy invoice / cabinet photo. We pin it to IPFS, attest the parsed line items on-chain under your facility wallet.
          </p>
        </div>
        <div class="text-right text-xs text-slate-500">
          period <span class="mono font-medium text-slate-700" x-text="period"></span>
        </div>
      </div>

      <form @submit.prevent="onPrimary()" class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <label class="flex flex-col text-xs text-slate-500">
            Facility
            <input type="text" readonly :value="selectedName()"
                   class="mt-1 bg-slate-50 border border-slate-200 rounded px-3 py-2 text-sm text-slate-800">
          </label>
          <label class="flex flex-col text-xs text-slate-500">
            Uploaded by (operator ID)
            <input x-model="form.staff_pseudonym" required
                   class="mt-1 bg-white border border-slate-300 rounded px-3 py-2 text-sm">
          </label>
        </div>

        <!-- Step 1: pick a photo to parse -->
        <div class="border-2 border-dashed border-slate-300 rounded-lg p-5 text-sm">
          <div class="flex items-center justify-between mb-3">
            <div>
              <div class="font-medium text-slate-700">Receipt / cabinet photo</div>
              <div class="text-xs text-slate-500">JPG or PNG, up to 10 MB</div>
            </div>
            <input type="file" accept="image/*" x-ref="file" @change="onFile()"
                   class="text-xs text-slate-600">
          </div>
          <template x-if="preview">
            <img :src="preview" class="max-h-56 rounded border border-slate-200" alt="preview">
          </template>
          <template x-if="!preview">
            <div class="text-xs text-slate-400">no file chosen</div>
          </template>
        </div>

        <!-- Step 2: parsed line items — editable BEFORE anchoring -->
        <template x-if="parsed">
          <div class="border border-slate-200 rounded-lg p-4 bg-slate-50 text-sm">
            <div class="flex items-center justify-between mb-2">
              <div>
                <div class="text-xs tracking-wider uppercase text-slate-500">parsed line items</div>
                <div class="text-xs text-slate-500">edit any row before anchoring; receipt total recomputes live</div>
              </div>
              <div class="text-xs text-slate-500">
                invoice
                <input x-model="parsed.invoice_ref"
                       class="mono bg-white border border-slate-300 rounded px-1 py-0.5 w-32 text-xs">
                · supplier
                <input x-model="parsed.supplier"
                       class="bg-white border border-slate-300 rounded px-1 py-0.5 w-40 text-xs">
              </div>
            </div>
            <table class="w-full text-xs">
              <thead class="text-slate-500">
                <tr>
                  <th class="text-left py-1">drug</th>
                  <th class="text-right py-1">qty</th>
                  <th class="text-right py-1">unit price</th>
                  <th class="text-right py-1">line total</th>
                  <th class="w-6"></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="(li, idx) in parsed.line_items" :key="idx">
                  <tr class="border-t border-slate-200">
                    <td class="py-1 capitalize">
                      <input x-model="li.drug"
                             class="bg-white border border-slate-200 rounded px-1 py-0.5 text-xs w-40 capitalize">
                    </td>
                    <td class="text-right">
                      <input type="number" step="1" min="0" x-model.number="li.qty"
                             @input="recalc(li)"
                             class="mono bg-white border border-slate-200 rounded px-1 py-0.5 text-xs w-20 text-right">
                    </td>
                    <td class="text-right">
                      <input type="number" step="0.01" min="0" x-model.number="li.unit_price"
                             @input="recalc(li)"
                             class="mono bg-white border border-slate-200 rounded px-1 py-0.5 text-xs w-24 text-right">
                    </td>
                    <td class="text-right mono"
                        x-text="'$' + (li.total || 0).toFixed(2)"></td>
                    <td>
                      <button type="button" @click="parsed.line_items.splice(idx, 1); recalcAll()"
                              class="text-slate-400 hover:text-red-600" title="remove">✕</button>
                    </td>
                  </tr>
                </template>
                <tr class="border-t-2 border-slate-300 font-semibold">
                  <td colspan="3" class="text-right py-1 pr-2">receipt total</td>
                  <td class="text-right mono" x-text="'$' + parsedTotal().toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})"></td>
                  <td></td>
                </tr>
              </tbody>
            </table>
            <button type="button" @click="addLineItem()"
                    class="mt-2 text-xs text-slate-600 hover:text-slate-900 border border-slate-200 rounded px-2 py-1">
              + add line item
            </button>
          </div>
        </template>

        <div class="flex items-center justify-end gap-3">
          <template x-if="error">
            <div class="text-sm text-red-700" x-text="error"></div>
          </template>
          <template x-if="parsed">
            <button type="button" @click="resetParse()"
                    class="text-xs border border-slate-300 rounded px-3 py-2 hover:bg-slate-50">
              start over
            </button>
          </template>
          <button type="submit" :disabled="busy || !preview"
                  class="bg-slate-900 text-white rounded px-4 py-2 text-sm font-medium hover:bg-slate-700 disabled:bg-slate-400">
            <span x-text="primaryLabel()"></span>
          </button>
        </div>
      </form>
    </section>

    <!-- Snapshot history -->
    <section class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm">
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold">Snapshot history</h2>
        <button @click="loadSnapshots()" class="text-xs text-slate-600 hover:text-slate-900 border border-slate-200 rounded px-2 py-1">refresh</button>
      </div>
      <template x-if="!snapshots.length">
        <div class="text-sm text-slate-500">No snapshots yet for this facility. Upload one above.</div>
      </template>
      <div class="space-y-3">
        <template x-for="s in snapshots" :key="s.tx_hash">
          <article class="border border-slate-200 rounded-lg p-4 flex gap-4">
            <template x-if="s.image_url">
              <a :href="s.image_url" target="_blank" class="shrink-0">
                <img :src="s.image_url" class="w-24 h-24 object-cover rounded border border-slate-200" alt="snapshot">
              </a>
            </template>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2">
                <span class="font-medium" x-text="s.period"></span>
                <template x-if="s.block_number">
                  <span class="text-xs pill-green px-2 py-0.5 rounded">✓ on-chain · block <span x-text="s.block_number"></span></span>
                </template>
                <template x-if="!s.block_number && !s.mocked">
                  <span class="text-xs pill-yellow px-2 py-0.5 rounded pulse">⏳ anchoring…</span>
                </template>
                <template x-if="s.mocked">
                  <span class="text-xs pill-yellow px-2 py-0.5 rounded">on-chain (mock)</span>
                </template>
                <span class="text-xs text-slate-500">signer <span class="font-medium text-slate-700" x-text="s.signer_role || 'facility'"></span></span>
                <span class="text-xs text-slate-400 ml-auto mono" x-text="short(s.tx_hash)"></span>
              </div>
              <div class="mt-1 text-sm text-slate-600">
                <span class="font-medium" x-text="s.supplier || 'supplier?'"></span>
                · <span x-text="s.line_items ? s.line_items.length + ' line items' : '-'"></span>
                · <span x-text="s.receipt_total ? '$' + s.receipt_total.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}) : '-'"></span>
              </div>
              <div class="mt-1 text-xs flex gap-3 flex-wrap text-slate-500">
                <template x-if="s.explorer_url"><a :href="s.explorer_url" target="_blank" class="text-blue-600 hover:underline">Basescan ↗</a></template>
                <template x-if="s.metadata_url"><a :href="s.metadata_url" target="_blank" class="text-blue-600 hover:underline">IPFS metadata ↗</a></template>
                <template x-if="s.image_url"><a :href="s.image_url" target="_blank" class="text-blue-600 hover:underline">IPFS photo ↗</a></template>
                <span class="mono" x-text="'claim ' + short(s.claim_hash)"></span>
              </div>
            </div>
          </article>
        </template>
      </div>
    </section>
  </main>

<script>
function facility() {
  return {
    facilities: [],
    selected: null,
    chain: {ok: false, chain: '?'},
    period: new Date().toISOString().slice(0,7),
    form: { staff_pseudonym: 'FACILITY-ADMIN' },
    preview: null,          // data URL for <img>
    parsed: null,           // {line_items:[], invoice_ref, supplier} once "parse" click fires
    busy: false,            // true during either parse or anchor
    error: null,
    snapshots: [],

    async init() {
      try { this.chain = await fetch('/chain/health').then(r=>r.json()); } catch(_){}
      try {
        this.facilities = await fetch('/facilities').then(r=>r.json());
        const q = new URLSearchParams(location.search).get('facility');
        this.selected = q || (this.facilities[0] && this.facilities[0].id);
        await this.onFacilityChange();
      } catch(e) { this.error = 'failed to load facilities'; }
    },

    selectedName() {
      const f = this.facilities.find(x => x.id === this.selected);
      return f ? f.name : '';
    },

    async onFacilityChange() {
      history.replaceState(null, '', '?facility=' + encodeURIComponent(this.selected));
      this.resetParse();
      await this.loadSnapshots();
    },

    resetParse() {
      this.preview = null;
      this.parsed = null;
      this.error = null;
      if (this.$refs.file) this.$refs.file.value = '';
    },

    async loadSnapshots() {
      try {
        const r = await fetch('/facility/inventory?facility_id=' + encodeURIComponent(this.selected));
        const rows = r.ok ? await r.json() : [];
        this.snapshots = rows;
        for (let i = 0; i < this.snapshots.length; i++) {
          const rec = this.snapshots[i];
          if (rec.tx_hash && !rec.block_number && !rec.mocked) this.pollTx(i);
        }
      } catch(_) { this.snapshots = []; }
    },

    onFile() {
      const f = this.$refs.file.files[0];
      // A fresh file invalidates any prior parse.
      this.parsed = null;
      this.error = null;
      if (!f) { this.preview = null; return; }
      const reader = new FileReader();
      reader.onload = e => this.preview = e.target.result;
      reader.readAsDataURL(f);
    },

    // One button, two behaviors: first click → parse; second click → anchor.
    async onPrimary() {
      if (this.busy) return;
      if (!this.parsed) await this.parse();
      else              await this.commit();
    },

    primaryLabel() {
      if (this.busy)    return this.parsed ? 'Pinning & anchoring…' : 'Parsing…';
      if (!this.parsed) return 'Parse photo';
      return 'Sign & anchor on-chain';
    },

    // Step 1: upload photo, hit the server's parse endpoint, render the result
    // into an editable `parsed` object. NOTHING anchors here.
    async parse() {
      const file = this.$refs.file?.files[0];
      if (!file) { this.error = 'pick a photo first'; return; }
      this.busy = true;
      this.error = null;
      try {
        const fd = new FormData();
        fd.append('facility_id', this.selected);
        fd.append('image', file);
        const r = await fetch('/facility/inventory/parse', { method:'POST', body: fd });
        if (!r.ok) throw new Error('parse failed: ' + r.status);
        const j = await r.json();
        // Normalize into editable rows; ensure each has a numeric total.
        const items = (j.line_items || []).map(li => ({
          drug:       li.drug || '',
          qty:        Number(li.qty) || 0,
          unit_price: Number(li.unit_price) || 0,
          total:      Number(li.total) || (Number(li.qty) * Number(li.unit_price)) || 0,
        }));
        this.parsed = {
          invoice_ref: j.invoice_ref || '',
          supplier:    j.supplier    || '',
          line_items:  items,
          // keep the photo CID server returned so commit() reuses it (one pin, not two).
          image_cid:   j.image_cid,
          image_sha256: j.image_sha256,
          image_mime:  j.image_mime,
        };
      } catch(e) {
        this.error = e.message || String(e);
      }
      this.busy = false;
    },

    // Step 2: operator-edited `parsed` → canonical envelope → IPFS → facility-signed chain commit.
    async commit() {
      if (!this.parsed) return;
      this.busy = true;
      this.error = null;
      try {
        // Normalize numbers and recompute totals one last time before hashing.
        const line_items = this.parsed.line_items
          .filter(li => li.drug && li.qty > 0 && li.unit_price >= 0)
          .map(li => ({
            drug:       String(li.drug).trim(),
            qty:        Number(li.qty),
            unit_price: Number(li.unit_price),
            total:      +(Number(li.qty) * Number(li.unit_price)).toFixed(2),
          }));
        const body = {
          facility_id:     this.selected,
          period:          this.period,
          staff_pseudonym: this.form.staff_pseudonym,
          invoice_ref:     this.parsed.invoice_ref || '',
          supplier:        this.parsed.supplier    || '',
          line_items,
          receipt_total:   +line_items.reduce((s, li) => s + li.total, 0).toFixed(2),
          image_cid:       this.parsed.image_cid,
          image_sha256:    this.parsed.image_sha256,
          image_mime:      this.parsed.image_mime,
        };
        const r = await fetch('/facility/inventory/commit', {
          method:'POST',
          headers: {'content-type':'application/json'},
          body: JSON.stringify(body),
        });
        if (!r.ok) throw new Error('anchor failed: ' + r.status);
        const resp = await r.json();
        this.snapshots.unshift(resp);
        if (!resp.block_number && !resp.mocked) this.pollTx(0);
        this.resetParse();
      } catch(e) {
        this.error = e.message || String(e);
      }
      this.busy = false;
    },

    // Editable-table helpers
    recalc(li) {
      li.total = +(Number(li.qty || 0) * Number(li.unit_price || 0)).toFixed(2);
    },
    recalcAll() { (this.parsed?.line_items || []).forEach(li => this.recalc(li)); },
    parsedTotal() {
      return (this.parsed?.line_items || []).reduce((s, li) => s + (Number(li.total) || 0), 0);
    },
    addLineItem() {
      if (!this.parsed) return;
      this.parsed.line_items.push({ drug: '', qty: 0, unit_price: 0, total: 0 });
    },

    pollTx(idx) {
      const tx = this.snapshots[idx]?.tx_hash;
      if (!tx || this.snapshots[idx]?.block_number) return;
      let tries = 0;
      const t = setInterval(async () => {
        tries++;
        try {
          const r = await fetch('/chain/' + tx).then(r=>r.json());
          if (r.verified && r.block_number) {
            const i = this.snapshots.findIndex(s => s.tx_hash === tx);
            if (i >= 0) this.snapshots[i].block_number = r.block_number;
            clearInterval(t);
          }
        } catch(_){}
        if (tries > 20) clearInterval(t);
      }, 3000);
    },

    short(h) { return h ? (h.slice(0,10) + '…' + h.slice(-6)) : ''; },
  };
}
</script>
</body>
</html>
