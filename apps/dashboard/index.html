<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verity Care — Investigator Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
    .pill-red    { background: #fee2e2; color: #991b1b; }
    .pill-yellow { background: #fef3c7; color: #92400e; }
    .pill-green  { background: #dcfce7; color: #166534; }
    .dot-red    { background: #dc2626; }
    .dot-yellow { background: #d97706; }
    .dot-green  { background: #16a34a; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    @keyframes pulse-slow { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
    .pulse { animation: pulse-slow 1.4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<div x-data="dashboard()" x-init="init()" class="flex min-h-screen">

  <!-- LEFT RAIL: facilities -->
  <aside class="w-80 bg-white border-r border-slate-200 flex flex-col">
    <div class="px-5 py-4 border-b border-slate-200">
      <div class="text-xs tracking-wider text-slate-500 uppercase">Verity Care</div>
      <div class="text-lg font-semibold">Investigator Dashboard</div>
      <div class="mt-2 flex items-center gap-2 text-xs">
        <span class="inline-block w-2 h-2 rounded-full" :class="chain.ok ? 'dot-green' : 'dot-red'"></span>
        <span class="text-slate-600" x-text="chain.ok ? ('on-chain: ' + chain.chain + (chain.mock ? ' (mock)' : '')) : 'on-chain: offline'"></span>
      </div>
    </div>
    <div class="overflow-y-auto flex-1">
      <template x-for="f in facilities" :key="f.id">
        <button @click="select(f)"
                class="w-full text-left px-5 py-3 border-b border-slate-100 hover:bg-slate-50"
                :class="selected?.id === f.id ? 'bg-slate-100' : ''">
          <div class="flex items-center gap-3">
            <span class="w-2 h-2 rounded-full flex-shrink-0"
                  :class="'dot-' + f.severity_hint"></span>
            <div class="flex-1 min-w-0">
              <div class="font-medium text-sm truncate" x-text="f.name"></div>
              <div class="text-xs text-slate-500" x-text="f.state + ' · CCN ' + f.ccn + ' · ' + f.beds + ' beds'"></div>
            </div>
          </div>
        </button>
      </template>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-8 py-5">
      <template x-if="selected">
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-2xl font-semibold" x-text="selected.name"></h1>
            <span class="px-2 py-0.5 rounded text-xs font-medium"
                  :class="'pill-' + (aggregate_severity || selected.severity_hint)"
                  x-text="(aggregate_severity || selected.severity_hint).toUpperCase()"></span>
            <button @click="commitAllUnsigned()"
                    x-show="spend.signals && spend.signals.some(c => !c.chain_commit)"
                    :disabled="batchCommitting"
                    class="ml-auto text-xs bg-slate-900 text-white rounded px-3 py-1 font-medium hover:bg-slate-700 disabled:bg-slate-400">
              <span x-text="batchCommitting ? ('committing ' + batchProgress + '…') : 'Commit all unsigned on-chain'"></span>
            </button>
          </div>
          <div class="text-sm text-slate-500 mt-1">
            <span x-text="selected.state"></span> ·
            <span>CCN <span x-text="selected.ccn"></span></span> ·
            <span x-text="selected.beds + ' beds'"></span> ·
            parent <span class="font-medium text-slate-700" x-text="selected.parent_llc_hint"></span>
          </div>
          <div class="text-xs text-slate-500 mt-1">
            cited:
            <a :href="selected.citation.url" target="_blank" class="text-blue-600 hover:underline"
               x-text="selected.citation.source"></a>
          </div>
        </div>
      </template>
      <template x-if="!selected">
        <div class="text-slate-400">Select a facility on the left to begin.</div>
      </template>
    </header>

    <!-- Tabs -->
    <nav class="bg-white border-b border-slate-200 px-8 flex gap-6">
      <template x-for="t in tabs" :key="t">
        <button @click="activeTab = t"
                class="py-3 border-b-2 text-sm font-medium"
                :class="activeTab === t ? 'border-slate-900 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-700'">
          <span x-text="t.toUpperCase()"></span>
        </button>
      </template>
    </nav>

    <!-- Tab content -->
    <section class="flex-1 overflow-y-auto p-8">
      <template x-if="!selected">
        <div class="text-slate-400">No facility selected.</div>
      </template>

      <!-- SPEND -->
      <template x-if="selected && activeTab === 'spend'">
        <div>
          <template x-if="loadingSpend">
            <div class="text-slate-500">Loading SPEND signals…</div>
          </template>
          <template x-if="!loadingSpend && spend.signals && spend.signals.length === 0">
            <div class="text-slate-500">No SPEND signals for this facility.</div>
          </template>
          <div class="space-y-4" x-show="!loadingSpend && spend.signals && spend.signals.length">
            <template x-for="card in spend.signals" :key="card.signal_id">
              <article class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">
                <div class="flex items-start justify-between gap-4">
                  <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="w-2 h-2 rounded-full" :class="'dot-' + card.severity"></span>
                      <span class="text-xs tracking-wider uppercase text-slate-500"
                            x-text="card.signal_type.replace(/_/g, ' ')"></span>
                      <span class="text-xs px-1.5 py-0.5 rounded" :class="'pill-' + card.severity"
                            x-text="card.severity"></span>
                      <template x-if="card.data_provenance">
                        <span class="text-xs text-slate-500" x-text="'· ' + card.data_provenance"></span>
                      </template>
                    </div>
                    <div class="font-medium text-slate-900" x-text="card.headline"></div>
                    <template x-if="card.detail">
                      <div class="text-sm text-slate-600 mt-1" x-text="card.detail"></div>
                    </template>
                  </div>
                </div>

                <!-- Chain footer: state-machine (idle → committing → pending → confirmed) -->
                <div class="mt-4 pt-4 border-t border-slate-100 text-xs">
                  <!-- idle -->
                  <template x-if="!card.chain_commit && !card._committing">
                    <div class="flex items-center gap-3">
                      <span class="text-slate-400">not committed on-chain</span>
                      <button @click="commitCard(card)"
                              class="ml-auto bg-slate-900 text-white rounded px-3 py-1 text-xs font-medium hover:bg-slate-700">
                        Commit on-chain
                      </button>
                    </div>
                  </template>

                  <!-- committing: POST in flight -->
                  <template x-if="!card.chain_commit && card._committing">
                    <div class="flex items-center gap-3">
                      <span class="pulse text-slate-500">signing &amp; broadcasting…</span>
                    </div>
                  </template>

                  <!-- pending: tx broadcast, awaiting block -->
                  <template x-if="card.chain_commit && !card.chain_commit.block_number">
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                      <span class="pill-yellow px-2 py-0.5 rounded font-medium pulse">⏳ pending</span>
                      <span class="text-slate-500">
                        signer <span class="font-medium text-slate-700" x-text="card.chain_commit.signer_role || 'facility'"></span>
                      </span>
                      <span class="mono text-slate-400" x-text="shortHash(card.chain_commit.tx_hash)"></span>
                      <template x-if="card.chain_commit.explorer_url">
                        <a :href="card.chain_commit.explorer_url" target="_blank"
                           class="text-blue-600 hover:underline">Basescan ↗</a>
                      </template>
                      <span class="text-slate-400">· awaiting block confirmation</span>
                    </div>
                  </template>

                  <!-- confirmed: block number in hand -->
                  <template x-if="card.chain_commit && card.chain_commit.block_number">
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                      <span class="pill-green px-2 py-0.5 rounded font-medium">✓ on-chain</span>
                      <span class="text-slate-500">
                        signed by <span class="font-medium text-slate-700" x-text="card.chain_commit.signer_role || 'facility'"></span>
                      </span>
                      <span class="text-slate-500">
                        block <span class="font-medium text-slate-700" x-text="card.chain_commit.block_number"></span>
                      </span>
                      <span class="mono text-slate-400" x-text="shortHash(card.chain_commit.tx_hash)"></span>
                      <template x-if="card.chain_commit.explorer_url">
                        <a :href="card.chain_commit.explorer_url" target="_blank"
                           class="text-blue-600 hover:underline">Basescan ↗</a>
                      </template>
                      <button @click="verifyCard(card)"
                              class="ml-auto text-slate-600 hover:text-slate-900 border border-slate-200 rounded px-2 py-1">
                        re-verify
                      </button>
                    </div>
                  </template>

                  <!-- Claim-hash subline, shown whenever there's any chain activity -->
                  <template x-if="card.chain_commit && card.chain_commit.claim_hash">
                    <div class="mt-1 text-slate-400">
                      claim hash <span class="mono" x-text="shortHash(card.chain_commit.claim_hash)"></span>
                      <span class="text-slate-300">· SHA-256 of card content</span>
                    </div>
                  </template>
                </div>

                <!-- Verification result -->
                <template x-if="card._verify">
                  <div class="mt-3 p-3 bg-slate-50 rounded text-xs mono text-slate-700">
                    <div class="font-sans not-italic text-slate-500 mb-1">verification</div>
                    <div>verified: <span x-text="card._verify.verified"></span></div>
                    <div>source: <span x-text="card._verify.source"></span></div>
                    <template x-if="card._verify.block_number !== null && card._verify.block_number !== undefined">
                      <div>block: <span x-text="card._verify.block_number"></span></div>
                    </template>
                    <div>signer: <span x-text="card._verify.signer_role + ' · ' + card._verify.signer_address"></span></div>
                    <template x-if="card._verify.note">
                      <div class="text-slate-500 font-sans not-italic" x-text="card._verify.note"></div>
                    </template>
                  </div>
                </template>
              </article>
            </template>
          </div>
        </div>
      </template>

      <template x-if="selected && activeTab === 'shift'">
        <div class="text-slate-500">SHIFT pillar — awaiting Leo's phantom-shift service.</div>
      </template>

      <template x-if="selected && activeTab === 'proof of service'">
        <div class="text-slate-500">
          Staff uploads service-delivery photos here (meal, insulin, visit). Each upload → IPFS → metadata JSON → on-chain commit signed by the staff wallet. Verifier fetches metadata from IPFS and recomputes <code class="mono">sha256(canonical(metadata))</code> to match the on-chain hash. Abhi designing this view; backend endpoints <code class="mono">POST /delivery</code> and <code class="mono">GET /deliveries?facility_id=…</code> are live.
        </div>
      </template>

      <template x-if="selected && activeTab === 'case file'">
        <div class="text-slate-500">CASE FILE — aggregator + ed25519 signing + PDF export pending.</div>
      </template>
    </section>
  </main>
</div>

<script>
function dashboard() {
  return {
    tabs: ['spend', 'shift', 'proof of service', 'case file'],
    activeTab: 'spend',
    facilities: [],
    selected: null,
    spend: { signals: [] },
    loadingSpend: false,
    chain: { ok: false, chain: '?', mock: true },
    aggregate_severity: null,
    batchCommitting: false,
    batchProgress: '',
    _pollers: {},        // { tx_hash: intervalId } — global map

    async init() {
      try {
        const h = await fetch('/chain/health').then(r => r.json());
        this.chain = { ok: !!h.ok, chain: h.chain || '?', mock: !!h.mock };
      } catch (_) {}
      try {
        this.facilities = await fetch('/facilities').then(r => r.json());
        if (this.facilities.length) this.select(this.facilities[0]);
      } catch (e) { console.error(e); }
    },

    async select(f) {
      // Clear pollers from the previous facility.
      for (const id of Object.values(this._pollers)) clearInterval(id);
      this._pollers = {};

      this.selected = f;
      this.spend = { signals: [] };
      this.aggregate_severity = null;
      this.loadingSpend = true;
      try {
        const j = await fetch('/spend/' + f.id).then(r => r.json());
        j.signals = (j.signals || []).map(c => ({ ...c, _committing: false, _verify: null }));
        this.spend = j;
        const sev = j.signals.map(c => c.severity);
        this.aggregate_severity = sev.includes('red') ? 'red'
                                : sev.includes('yellow') ? 'yellow'
                                : sev.length ? 'green' : null;

        // Rehydrate from chain: for every card without a chain_commit, compute the
        // canonical hash and ask the onchain service if we've ever committed that
        // hash. If yes, attach the chain_commit block from the authoritative local
        // log + live chain receipt. This is why refresh "forgets nothing" — the
        // chain IS the database.
        await Promise.all(j.signals.map(c => this.rehydrateFromChain(c)));

        // Any card that landed pre-anchored but not yet mined → start polling it.
        for (const c of j.signals) {
          if (c.chain_commit && c.chain_commit.tx_hash && !c.chain_commit.block_number) {
            this.startPolling(c);
          }
        }
      } catch (e) { console.error(e); }
      this.loadingSpend = false;
    },

    async rehydrateFromChain(card) {
      // Skip if the server already attached a chain_commit (e.g. Abhi pre-anchored).
      if (card.chain_commit) return;
      try {
        const claim_hash = await this.canonicalHash(card);
        const v = await fetch(
          '/chain/verify/by-hash?claim_type=4&claim_hash=' + encodeURIComponent(claim_hash)
        ).then(r => r.ok ? r.json() : null);
        if (!v || !v.count || !v.matches?.length) return;

        // Use the FIRST match (chronological order in the append-only log).
        // Multiple matches would mean someone re-committed the same card, which is
        // idempotent on-chain — any of them is equally valid proof.
        const m = v.matches[0];
        card.chain_commit = {
          tx_hash: m.tx_hash,
          explorer_url: m.explorer_url ?? null,
          block_number: m.block_number ?? null,
          committed_at: m.committed_at ?? null,
          signer_role: m.signer_role ?? 'facility',
          signer_address: m.signer_address ?? null,
          mocked: !!m.mocked,
          claim_hash,
        };

        // Local log may not have had block_number cached at commit time. Pull a
        // chain receipt to backfill if this isn't a mock tx.
        if (!card.chain_commit.block_number && !card.chain_commit.mocked
            && card.chain_commit.tx_hash) {
          try {
            const r = await fetch('/chain/' + card.chain_commit.tx_hash).then(r => r.json());
            if (r.verified && r.block_number) {
              card.chain_commit.block_number = r.block_number;
              card.chain_commit.signer_role = r.signer_role || card.chain_commit.signer_role;
              card.chain_commit.signer_address = r.signer_address || card.chain_commit.signer_address;
            }
          } catch (_) { /* RPC hiccup; poller will retry when startPolling fires */ }
        }
        // Mock tx → treat as already-final so the UI shows green immediately.
        if (card.chain_commit.mocked && !card.chain_commit.block_number) {
          card.chain_commit.block_number = 'mock';
        }
      } catch (_) {
        // Rehydration is best-effort; a failure just leaves the card as uncommitted.
      }
    },

    shortHash(h) {
      if (!h) return '';
      return h.length > 14 ? h.slice(0, 8) + '…' + h.slice(-6) : h;
    },

    async canonicalHash(card) {
      const clean = Object.fromEntries(
        Object.entries(card).filter(([k]) => !k.startsWith('_') && k !== 'chain_commit')
      );
      const canon = JSON.stringify(sortedCopy(clean));
      const buf = new TextEncoder().encode(canon);
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return '0x' + Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    },

    async commitCard(card) {
      if (card._committing || card.chain_commit) return;  // idempotent
      card._committing = true;
      try {
        const claim_hash = await this.canonicalHash(card);
        const tx = await fetch('/chain/commit', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ claim_type: 4, claim_hash }),
        }).then(r => r.json());
        card.chain_commit = {
          tx_hash: tx.tx_hash,
          explorer_url: tx.explorer_url,
          block_number: tx.block_number,   // null now; filled by poller when mined
          committed_at: tx.committed_at,
          signer_role: tx.signer_role,
          signer_address: tx.signer_address,
          mocked: tx.mocked,
          claim_hash,
        };
        // Mock txs skip the poller — the local service already treats them as final.
        if (tx.mocked) {
          card.chain_commit.block_number = 'mock';
        } else {
          this.startPolling(card);
        }
      } catch (e) {
        alert('Commit failed: ' + e.message);
      }
      card._committing = false;
    },

    startPolling(card) {
      const tx = card.chain_commit?.tx_hash;
      if (!tx || this._pollers[tx]) return;

      const poll = async () => {
        try {
          const r = await fetch('/chain/' + tx).then(r => r.json());
          card._verify = r;
          if (r.verified && r.block_number) {
            card.chain_commit.block_number = r.block_number;
            card.chain_commit.signer_role = r.signer_role || card.chain_commit.signer_role;
            card.chain_commit.signer_address = r.signer_address || card.chain_commit.signer_address;
            clearInterval(this._pollers[tx]);
            delete this._pollers[tx];
          }
        } catch (_) { /* transient; keep polling */ }
      };
      poll();                                                // kick immediately
      this._pollers[tx] = setInterval(poll, 3000);
    },

    async verifyCard(card) {
      if (!card.chain_commit?.tx_hash) return;
      try {
        card._verify = await fetch('/chain/' + card.chain_commit.tx_hash).then(r => r.json());
        if (card._verify.verified && card._verify.block_number) {
          card.chain_commit.block_number = card._verify.block_number;
        }
      } catch (e) {
        card._verify = { verified: false, source: 'error', note: e.message };
      }
    },

    async commitAllUnsigned() {
      const todo = this.spend.signals.filter(c => !c.chain_commit && !c._committing);
      if (!todo.length) return;
      this.batchCommitting = true;
      let n = 0;
      for (const c of todo) {
        n++;
        this.batchProgress = n + '/' + todo.length;
        await this.commitCard(c);   // signer lock serializes anyway — nonce-safe
      }
      this.batchCommitting = false;
      this.batchProgress = '';
    },
  };
}

// Recursive key-sorted copy for canonical JSON hashing.
function sortedCopy(v) {
  if (Array.isArray(v)) return v.map(sortedCopy);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v).sort()) out[k] = sortedCopy(v[k]);
    return out;
  }
  return v;
}
</script>
</body>
</html>
