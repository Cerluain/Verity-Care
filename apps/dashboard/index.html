<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verity Care — Investigator Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <script src="/static/spend-extras.js"></script>
  <script src="/static/nav.js" defer></script>
  <script defer src="https://unpkg.com/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, sans-serif; }
    .pill-red    { background: #fee2e2; color: #991b1b; }
    .pill-yellow { background: #fef3c7; color: #92400e; }
    .pill-green  { background: #dcfce7; color: #166534; }
    .dot-red    { background: #dc2626; }
    .dot-yellow { background: #d97706; }
    .dot-green  { background: #16a34a; }
    .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
    @keyframes pulse-slow { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
    .pulse { animation: pulse-slow 1.4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<div x-data="dashboard()" x-init="init()" class="flex min-h-screen">

  <!-- LEFT RAIL: facilities -->
  <aside class="w-80 bg-white border-r border-slate-200 flex flex-col">
    <div class="px-5 py-4 border-b border-slate-200">
      <div class="text-xs tracking-wider text-slate-500 uppercase">Verity Care</div>
      <div class="text-lg font-semibold">Investigator Dashboard</div>
      <div class="mt-2 flex items-center gap-2 text-xs">
        <span class="inline-block w-2 h-2 rounded-full" :class="chain.ok ? 'dot-green' : 'dot-red'"></span>
        <span class="text-slate-600" x-text="chain.ok ? ('on-chain: ' + chain.chain + (chain.mock ? ' (mock)' : '')) : 'on-chain: offline'"></span>
      </div>
    </div>
    <div class="overflow-y-auto flex-1">
      <template x-for="f in facilities" :key="f.id">
        <button @click="select(f)"
                class="w-full text-left px-5 py-3 border-b border-slate-100 hover:bg-slate-50"
                :class="selected?.id === f.id ? 'bg-slate-100' : ''">
          <div class="flex items-center gap-3">
            <span class="w-2 h-2 rounded-full flex-shrink-0"
                  :class="'dot-' + f.severity_hint"></span>
            <div class="flex-1 min-w-0">
              <div class="font-medium text-sm truncate" x-text="f.name"></div>
              <div class="text-xs text-slate-500" x-text="f.state + ' · CCN ' + f.ccn + ' · ' + f.beds + ' beds'"></div>
            </div>
          </div>
        </button>
      </template>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-8 py-5">
      <template x-if="selected">
        <div>
          <div class="flex items-center gap-3">
            <h1 class="text-2xl font-semibold" x-text="selected.name"></h1>
            <span class="px-2 py-0.5 rounded text-xs font-medium"
                  :class="'pill-' + (aggregate_severity || selected.severity_hint)"
                  x-text="(aggregate_severity || selected.severity_hint).toUpperCase()"></span>
            <button @click="commitAllUnsigned()"
                    x-show="spend.signals && spend.signals.some(c => !c.chain_commit)"
                    :disabled="batchCommitting"
                    class="ml-auto text-xs bg-slate-900 text-white rounded px-3 py-1 font-medium hover:bg-slate-700 disabled:bg-slate-400">
              <span x-text="batchCommitting ? ('committing ' + batchProgress + '…') : 'Commit all unsigned on-chain'"></span>
            </button>
          </div>
          <div class="text-sm text-slate-500 mt-1">
            <span x-text="selected.state"></span> ·
            <span>CCN <span x-text="selected.ccn"></span></span> ·
            <span x-text="selected.beds + ' beds'"></span> ·
            parent <span class="font-medium text-slate-700" x-text="selected.parent_llc_hint"></span>
          </div>
          <div class="text-xs text-slate-500 mt-1">
            cited:
            <a :href="selected.citation.url" target="_blank" class="text-blue-600 hover:underline"
               x-text="selected.citation.source"></a>
          </div>
        </div>
      </template>
      <template x-if="!selected">
        <div class="text-slate-400">Select a facility on the left to begin.</div>
      </template>
    </header>

    <!-- Tabs -->
    <nav class="bg-white border-b border-slate-200 px-8 flex gap-6">
      <template x-for="t in tabs" :key="t">
        <button @click="activeTab = t"
                class="py-3 border-b-2 text-sm font-medium"
                :class="activeTab === t ? 'border-slate-900 text-slate-900' : 'border-transparent text-slate-500 hover:text-slate-700'">
          <span x-text="t.toUpperCase()"></span>
        </button>
      </template>
    </nav>

    <!-- Tab content -->
    <section class="flex-1 overflow-y-auto p-8">
      <template x-if="!selected">
        <div class="text-slate-400">No facility selected.</div>
      </template>

      <!-- SPENDING -->
      <template x-if="selected && activeTab === 'spending'">
        <div>
          <!-- Verdict banner from the spend_overall card -->
          <template x-if="!loadingSpend && spendOverall()">
            <div class="mb-5 rounded-lg p-4 flex items-center gap-3"
                 :class="'pill-' + spendOverall().severity">
              <span class="w-3 h-3 rounded-full" :class="'dot-' + spendOverall().severity"></span>
              <div>
                <div class="font-semibold" x-text="spendOverall().headline"></div>
                <div class="text-xs opacity-80">Red only when all three checks agree: price gap, shared ownership, impossible volume.</div>
              </div>
            </div>
          </template>
          <template x-if="loadingSpend">
            <div class="text-slate-500">Loading SPEND signals…</div>
          </template>
          <template x-if="!loadingSpend && spend.signals && spend.signals.length === 0">
            <div class="text-slate-500">No SPEND signals for this facility.</div>
          </template>
          <div class="space-y-4" x-show="!loadingSpend && spend.signals && spend.signals.length">
            <template x-for="card in spend.signals" :key="card.signal_id">
              <article class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">
                <div class="flex items-start justify-between gap-4">
                  <div class="flex-1">
                    <div class="flex items-center gap-2 mb-1">
                      <span class="w-2 h-2 rounded-full" :class="'dot-' + card.severity"></span>
                      <span class="text-xs tracking-wider uppercase text-slate-500"
                            x-text="card.signal_type.replace(/_/g, ' ')"></span>
                      <span class="text-xs px-1.5 py-0.5 rounded" :class="'pill-' + card.severity"
                            x-text="card.severity"></span>
                      <template x-if="card.data_provenance">
                        <span class="text-xs text-slate-500" x-text="'· ' + card.data_provenance"></span>
                      </template>
                    </div>
                    <div class="font-medium text-slate-900" x-text="card.headline"></div>
                    <template x-if="card.detail">
                      <div class="text-sm text-slate-600 mt-1" x-text="card.detail"></div>
                    </template>
                  </div>
                </div>

                <!-- Chain footer: state-machine (idle → committing → pending → confirmed) -->
                <div class="mt-4 pt-4 border-t border-slate-100 text-xs">
                  <!-- idle -->
                  <template x-if="!card.chain_commit && !card._committing">
                    <div class="flex items-center gap-3">
                      <span class="text-slate-400">not committed on-chain</span>
                      <button @click="commitCard(card)"
                              class="ml-auto bg-slate-900 text-white rounded px-3 py-1 text-xs font-medium hover:bg-slate-700">
                        Commit on-chain
                      </button>
                    </div>
                  </template>

                  <!-- committing: POST in flight -->
                  <template x-if="!card.chain_commit && card._committing">
                    <div class="flex items-center gap-3">
                      <span class="pulse text-slate-500">signing &amp; broadcasting…</span>
                    </div>
                  </template>

                  <!-- pending: tx broadcast, awaiting block -->
                  <template x-if="card.chain_commit && !card.chain_commit.block_number">
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                      <span class="pill-yellow px-2 py-0.5 rounded font-medium pulse">⏳ pending</span>
                      <span class="text-slate-500">
                        signer <span class="font-medium text-slate-700" x-text="card.chain_commit.signer_role || 'facility'"></span>
                      </span>
                      <span class="mono text-slate-400" x-text="shortHash(card.chain_commit.tx_hash)"></span>
                      <template x-if="card.chain_commit.explorer_url">
                        <a :href="card.chain_commit.explorer_url" target="_blank"
                           class="text-blue-600 hover:underline">Basescan ↗</a>
                      </template>
                      <span class="text-slate-400">· awaiting block confirmation</span>
                    </div>
                  </template>

                  <!-- confirmed: block number in hand -->
                  <template x-if="card.chain_commit && card.chain_commit.block_number">
                    <div class="flex flex-wrap items-center gap-x-3 gap-y-1">
                      <span class="pill-green px-2 py-0.5 rounded font-medium">✓ on-chain</span>
                      <span class="text-slate-500">
                        signed by <span class="font-medium text-slate-700" x-text="card.chain_commit.signer_role || 'facility'"></span>
                      </span>
                      <span class="text-slate-500">
                        block <span class="font-medium text-slate-700" x-text="card.chain_commit.block_number"></span>
                      </span>
                      <span class="mono text-slate-400" x-text="shortHash(card.chain_commit.tx_hash)"></span>
                      <template x-if="card.chain_commit.explorer_url">
                        <a :href="card.chain_commit.explorer_url" target="_blank"
                           class="text-blue-600 hover:underline">Basescan ↗</a>
                      </template>
                      <button @click="verifyCard(card)"
                              class="ml-auto text-slate-600 hover:text-slate-900 border border-slate-200 rounded px-2 py-1">
                        re-verify
                      </button>
                    </div>
                  </template>

                  <!-- Claim-hash subline, shown whenever there's any chain activity -->
                  <template x-if="card.chain_commit && card.chain_commit.claim_hash">
                    <div class="mt-1 text-slate-400">
                      claim hash <span class="mono" x-text="shortHash(card.chain_commit.claim_hash)"></span>
                      <span class="text-slate-300">· SHA-256 of card content</span>
                    </div>
                  </template>
                </div>

                <!-- Verification result -->
                <template x-if="card._verify">
                  <div class="mt-3 p-3 bg-slate-50 rounded text-xs mono text-slate-700">
                    <div class="font-sans not-italic text-slate-500 mb-1">verification</div>
                    <div>verified: <span x-text="card._verify.verified"></span></div>
                    <div>source: <span x-text="card._verify.source"></span></div>
                    <template x-if="card._verify.block_number !== null && card._verify.block_number !== undefined">
                      <div>block: <span x-text="card._verify.block_number"></span></div>
                    </template>
                    <div>signer: <span x-text="card._verify.signer_role + ' · ' + card._verify.signer_address"></span></div>
                    <template x-if="card._verify.note">
                      <div class="text-slate-500 font-sans not-italic" x-text="card._verify.note"></div>
                    </template>
                  </div>
                </template>
              </article>
            </template>
          </div>

          <!-- Ownership graph -->
          <template x-if="!loadingSpend && ownershipCard()">
            <div class="mt-8 bg-white border border-slate-200 rounded-lg shadow-sm">
              <div class="px-5 py-3 border-b border-slate-100 flex items-center gap-3">
                <div class="font-semibold">Who owns whom</div>
                <span class="text-xs text-slate-500">red = facility and supplier share an owner · hover a box for details · * = illustrative name</span>
              </div>
              <div class="h-96" x-init="$nextTick(() => renderOwnershipGraph($el, ownershipCard().evidence.ownership_graph))"
                   x-effect="spend.signals; $nextTick(() => renderOwnershipGraph($el, ownershipCard()?.evidence.ownership_graph))"></div>
              <div class="px-5 py-2 text-xs text-slate-500 border-t border-slate-100"
                   x-text="ownershipCard().evidence.ownership_graph.notes"></div>
            </div>
          </template>

          <!-- Invoice table -->
          <template x-if="!loadingSpend && invoiceRows().length">
            <div class="mt-8 bg-white border border-slate-200 rounded-lg shadow-sm overflow-x-auto">
              <div class="px-5 py-3 border-b border-slate-100 flex items-center gap-3">
                <div class="font-semibold">Supplier invoices → cost report</div>
                <span class="text-xs text-slate-500">Q3 2026 · invoice rows are demo data; reference prices are real CMS NADAC</span>
              </div>
              <table class="w-full text-sm">
                <thead class="text-xs uppercase tracking-wider text-slate-500 bg-slate-50">
                  <tr>
                    <th class="text-left px-4 py-2">Drug</th>
                    <th class="text-left px-4 py-2">Supplier</th>
                    <th class="text-right px-4 py-2">Qty</th>
                    <th class="text-right px-4 py-2">Paid / unit</th>
                    <th class="text-right px-4 py-2">Fair price</th>
                    <th class="text-right px-4 py-2">Markup</th>
                    <th class="text-right px-4 py-2">Qty vs need</th>
                    <th class="text-right px-4 py-2">Total</th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="r in invoiceRows()" :key="r.line_id">
                    <tr class="border-t border-slate-100"
                        :class="(r.price_severity === 'red' || r.volume_severity === 'red') ? 'bg-red-50/50' : ''">
                      <td class="px-4 py-2">
                        <div class="font-medium" x-text="r.drug"></div>
                        <div class="text-xs text-slate-400 mono" x-text="r.invoice_no + ' · ' + r.invoice_date"></div>
                      </td>
                      <td class="px-4 py-2">
                        <span x-text="r.supplier"></span>
                        <template x-if="r.related_party_supplier">
                          <span class="ml-1 text-xs pill-red px-1.5 py-0.5 rounded">same owner</span>
                        </template>
                      </td>
                      <td class="px-4 py-2 text-right" x-text="r.qty.toLocaleString() + ' ' + r.unit"></td>
                      <td class="px-4 py-2 text-right mono" x-text="money(r.unit_price)"></td>
                      <td class="px-4 py-2 text-right mono text-slate-500" x-text="money(r.reference_price)"></td>
                      <td class="px-4 py-2 text-right">
                        <span class="px-1.5 py-0.5 rounded text-xs font-medium" :class="'pill-' + r.price_severity"
                              x-text="r.price_ratio + '×'"></span>
                      </td>
                      <td class="px-4 py-2 text-right">
                        <span class="px-1.5 py-0.5 rounded text-xs font-medium" :class="'pill-' + r.volume_severity"
                              x-text="r.volume_ratio + '×'"></span>
                      </td>
                      <td class="px-4 py-2 text-right mono" x-text="'$' + r.total.toLocaleString()"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="px-5 py-2 text-xs text-slate-500 border-t border-slate-100">
                Fair price = CMS NADAC (national average acquisition cost). Markup: red &gt; 3×, yellow 1.5–3×.
                Qty vs need = units bought ÷ what the resident census could use: red &gt; 1.5×.
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- STAFFING (Leo / Dev B). Shows MOCK PBJ until phantom-shift is live. -->
      <template x-if="selected && activeTab === 'staffing'">
        <div x-init="loadStaffing()" x-effect="selected; loadStaffing()">
          <div class="mb-4 text-xs pill-yellow inline-block px-2 py-1 rounded">
            Mock staffing data — Leo's live SHIFT checks (licence collisions, suspended licences, impossible travel) plug in here.
          </div>
          <template x-if="staffing">
            <div class="grid grid-cols-4 gap-4">
              <div class="bg-white border border-slate-200 rounded-lg p-4">
                <div class="text-xs text-slate-500 uppercase tracking-wider">Residents / day</div>
                <div class="text-2xl font-semibold" x-text="staffing.avg_daily_census"></div>
              </div>
              <div class="bg-white border border-slate-200 rounded-lg p-4">
                <div class="text-xs text-slate-500 uppercase tracking-wider">RN hrs / resident / day</div>
                <div class="text-2xl font-semibold" x-text="staffing.hprd.rn"></div>
              </div>
              <div class="bg-white border border-slate-200 rounded-lg p-4">
                <div class="text-xs text-slate-500 uppercase tracking-wider">Aide hrs / resident / day</div>
                <div class="text-2xl font-semibold" x-text="staffing.hprd.cna"></div>
              </div>
              <div class="bg-white border border-slate-200 rounded-lg p-4">
                <div class="text-xs text-slate-500 uppercase tracking-wider">Total nurse hrs / resident / day</div>
                <div class="text-2xl font-semibold" x-text="staffing.hprd.total"></div>
                <div class="text-xs text-slate-500">CMS 2024 rule target: 3.48</div>
              </div>
            </div>
          </template>
          <template x-if="shiftSignals.length">
            <div class="mt-6 space-y-3">
              <template x-for="c in shiftSignals" :key="c.signal_id">
                <div class="bg-white border border-slate-200 rounded-lg p-4 flex gap-3 items-start">
                  <span class="w-2 h-2 mt-2 rounded-full" :class="'dot-' + c.severity"></span>
                  <div><div class="font-medium" x-text="c.headline"></div>
                       <div class="text-sm text-slate-600" x-text="c.detail || ''"></div></div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- GUARDIAN REPORTS: disputes + missed care from the guardian timeline -->
      <template x-if="selected && activeTab === 'guardian reports'">
        <div x-init="loadGuardianReports()" x-effect="selected; loadGuardianReports()">
          <div class="text-sm text-slate-600 mb-4">
            Families verify daily care on the guardian timeline. Anything they dispute, or that was scheduled but never photo-verified, lands here.
          </div>
          <template x-if="!guardianReports.length">
            <div class="text-slate-400">No guardian reports for this facility.</div>
          </template>
          <div class="space-y-3">
            <template x-for="r in guardianReports" :key="r.id">
              <div class="bg-white border border-slate-200 rounded-lg p-4">
                <div class="flex items-center gap-2">
                  <span class="text-xs px-1.5 py-0.5 rounded font-medium"
                        :class="r.kind === 'dispute' ? 'pill-red' : 'pill-yellow'"
                        x-text="r.kind === 'dispute' ? 'disputed by family' : 'not verified'"></span>
                  <span class="font-medium" x-text="r.title"></span>
                  <span class="text-xs text-slate-500 ml-auto" x-text="r.resident + ' · ' + r.time"></span>
                </div>
                <div class="text-sm text-slate-600 mt-1" x-text="r.detail"></div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <template x-if="selected && activeTab === 'proof of service'">
        <div class="space-y-6">
          <!-- Upload form -->
          <form @submit.prevent="submitDelivery()"
                class="bg-white border border-slate-200 rounded-lg p-5 shadow-sm">
            <div class="text-xs tracking-wider uppercase text-slate-500 mb-3">Record a delivery</div>
            <div class="grid grid-cols-2 gap-3">
              <label class="flex flex-col text-xs text-slate-500">
                Patient pseudonym
                <input x-model="pos.form.patient_pseudonym" required
                       class="mt-1 border border-slate-300 rounded px-2 py-1 text-sm text-slate-900">
              </label>
              <label class="flex flex-col text-xs text-slate-500">
                Staff pseudonym
                <input x-model="pos.form.staff_pseudonym" required
                       class="mt-1 border border-slate-300 rounded px-2 py-1 text-sm text-slate-900">
              </label>
              <label class="flex flex-col text-xs text-slate-500">
                Service type
                <select x-model="pos.form.service_type" required
                        class="mt-1 border border-slate-300 rounded px-2 py-1 text-sm text-slate-900">
                  <option value="meal">meal</option>
                  <option value="insulin">insulin</option>
                  <option value="medication">medication</option>
                  <option value="visit">visit</option>
                  <option value="wound_dressing">wound dressing</option>
                  <option value="pt_session">PT session</option>
                </select>
              </label>
              <label class="flex flex-col text-xs text-slate-500">
                Service detail
                <input x-model="pos.form.service_detail" required
                       class="mt-1 border border-slate-300 rounded px-2 py-1 text-sm text-slate-900">
              </label>
              <label class="flex flex-col text-xs text-slate-500 col-span-2">
                Photo
                <input type="file" accept="image/*" required
                       x-ref="posFile"
                       class="mt-1 text-sm text-slate-900">
              </label>
            </div>
            <div class="mt-4 flex items-center gap-3">
              <button type="submit" :disabled="pos.uploading"
                      class="bg-slate-900 text-white rounded px-3 py-1 text-sm font-medium hover:bg-slate-700 disabled:bg-slate-400">
                <span x-text="pos.uploading ? 'uploading…' : 'Submit & anchor on-chain'"></span>
              </button>
              <template x-if="pos.error">
                <span class="text-xs text-red-600" x-text="pos.error"></span>
              </template>
            </div>
          </form>

          <!-- Proof cards -->
          <template x-if="pos.loading">
            <div class="text-slate-500">Loading deliveries…</div>
          </template>
          <template x-if="!pos.loading && pos.deliveries.length === 0">
            <div class="text-slate-500">No delivery proofs for this facility yet. Submit one above.</div>
          </template>

          <div class="grid grid-cols-2 gap-4" x-show="pos.deliveries.length">
            <template x-for="d in pos.deliveries" :key="d.tx_hash">
              <article class="bg-white border border-slate-200 rounded-lg overflow-hidden shadow-sm">
                <div class="bg-slate-50 aspect-video flex items-center justify-center">
                  <template x-if="d.image_url && d.pin_mode === 'pinata'">
                    <img :src="d.image_url" :alt="d.service_type"
                         class="max-h-full max-w-full object-contain">
                  </template>
                  <template x-if="d.pin_mode !== 'pinata'">
                    <div class="text-center text-slate-400 text-xs p-4">
                      <div class="mono mb-1" x-text="d.image_cid"></div>
                      <div>(mock CID — Pinata JWT not set)</div>
                    </div>
                  </template>
                </div>
                <div class="p-4 space-y-2">
                  <div class="flex items-center justify-between">
                    <div class="text-sm font-semibold capitalize" x-text="d.service_type.replace(/_/g,' ')"></div>
                    <div class="text-xs text-slate-500" x-text="new Date(d.delivered_at).toLocaleString()"></div>
                  </div>
                  <template x-if="d.service_detail">
                    <div class="text-sm text-slate-600" x-text="d.service_detail"></div>
                  </template>
                  <div class="text-xs text-slate-500">
                    patient <span class="mono text-slate-700" x-text="d.patient_pseudonym"></span>
                    · staff <span class="mono text-slate-700" x-text="d.staff_pseudonym"></span>
                  </div>

                  <!-- Chain row -->
                  <div class="pt-2 mt-2 border-t border-slate-100 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs">
                    <template x-if="d.block_number">
                      <span class="pill-green px-2 py-0.5 rounded font-medium">✓ on-chain</span>
                    </template>
                    <template x-if="!d.block_number">
                      <span class="pill-yellow px-2 py-0.5 rounded font-medium pulse">⏳ pending</span>
                    </template>
                    <span class="text-slate-500">signer <span class="font-medium text-slate-700" x-text="d.signer_role || 'staff'"></span></span>
                    <template x-if="d.block_number && d.block_number !== 'mock'">
                      <span class="text-slate-500">block <span class="font-medium text-slate-700" x-text="d.block_number"></span></span>
                    </template>
                    <span class="mono text-slate-400" x-text="shortHash(d.tx_hash)"></span>
                    <template x-if="d.explorer_url">
                      <a :href="d.explorer_url" target="_blank" class="text-blue-600 hover:underline">Basescan ↗</a>
                    </template>
                  </div>
                  <div class="text-xs text-slate-400 flex flex-wrap gap-x-3">
                    <span>claim hash <span class="mono" x-text="shortHash(d.claim_hash)"></span></span>
                    <template x-if="d.metadata_url && d.pin_mode === 'pinata'">
                      <a :href="d.metadata_url" target="_blank" class="text-blue-600 hover:underline">metadata on IPFS ↗</a>
                    </template>
                    <template x-if="d.image_url && d.pin_mode === 'pinata'">
                      <a :href="d.image_url" target="_blank" class="text-blue-600 hover:underline">image on IPFS ↗</a>
                    </template>
                  </div>
                </div>
              </article>
            </template>
          </div>
        </div>
      </template>

      <template x-if="selected && activeTab === 'case file'">
        <div class="text-slate-500">CASE FILE — aggregator + ed25519 signing + PDF export pending.</div>
      </template>
    </section>
  </main>
</div>

<script>
function dashboard() {
  return {
    tabs: ['spending', 'staffing', 'proof of service', 'guardian reports', 'case file'],
    activeTab: 'spending',
    staffing: null,
    shiftSignals: [],
    guardianReports: [],
    facilities: [],
    selected: null,
    spend: { signals: [] },
    loadingSpend: false,
    chain: { ok: false, chain: '?', mock: true },
    aggregate_severity: null,
    batchCommitting: false,
    batchProgress: '',
    _pollers: {},        // { tx_hash: intervalId } — global map
    pos: {
      form: { patient_pseudonym: '', staff_pseudonym: '', service_type: '', service_detail: '' },
      deliveries: [],
      loading: false,
      uploading: false,
      error: null,
    },

    async init() {
      try {
        const h = await fetch('/chain/health').then(r => r.json());
        this.chain = { ok: !!h.ok, chain: h.chain || '?', mock: !!h.mock };
      } catch (_) {}
      try {
        this.facilities = await fetch('/facilities').then(r => r.json());
        if (this.facilities.length) this.select(this.facilities[0]);
      } catch (e) { console.error(e); }
    },

    async select(f) {
      // Clear pollers from the previous facility.
      for (const id of Object.values(this._pollers)) clearInterval(id);
      this._pollers = {};

      this.selected = f;
      this.spend = { signals: [] };
      this.aggregate_severity = null;
      this.loadingSpend = true;
      this.pos.deliveries = [];
      this.pos.error = null;
      this.loadDeliveries(f.id);
      try {
        const j = await fetch('/spend/' + f.id).then(r => r.json());
        j.signals = (j.signals || []).map(c => ({ ...c, _committing: false, _verify: null }));
        // Show the SPEND verdict card first.
        j.signals.sort((a, b) => (b.signal_type === 'spend_overall') - (a.signal_type === 'spend_overall'));
        this.spend = j;
        // SPEND's contribution to the facility colour comes from the spend_overall card
        // (red only when all 3 SPEND checks agree), NOT from any single red signal.
        // Otherwise a rural home with high prices alone (crook-county-wy-rural) turns red.
        const overall = j.signals.find(c => c.signal_type === 'spend_overall');
        const sev = overall ? [overall.severity] : j.signals.map(c => c.severity);
        this.aggregate_severity = sev.includes('red') ? 'red'
                                : sev.includes('yellow') ? 'yellow'
                                : sev.length ? 'green' : null;

        // Rehydrate from chain: for every card without a chain_commit, compute the
        // canonical hash and ask the onchain service if we've ever committed that
        // hash. If yes, attach the chain_commit block from the authoritative local
        // log + live chain receipt. This is why refresh "forgets nothing" — the
        // chain IS the database.
        await Promise.all(j.signals.map(c => this.rehydrateFromChain(c)));

        // Any card that landed pre-anchored but not yet mined → start polling it.
        for (const c of j.signals) {
          if (c.chain_commit && c.chain_commit.tx_hash && !c.chain_commit.block_number) {
            this.startPolling(c);
          }
        }
      } catch (e) { console.error(e); }
      this.loadingSpend = false;
    },

    async rehydrateFromChain(card) {
      // Skip if the server already attached a chain_commit (e.g. Abhi pre-anchored).
      if (card.chain_commit) return;
      try {
        const claim_hash = await this.canonicalHash(card);
        const v = await fetch(
          '/chain/verify/by-hash?claim_type=4&claim_hash=' + encodeURIComponent(claim_hash)
        ).then(r => r.ok ? r.json() : null);
        if (!v || !v.count || !v.matches?.length) return;

        // Use the FIRST match (chronological order in the append-only log).
        // Multiple matches would mean someone re-committed the same card, which is
        // idempotent on-chain — any of them is equally valid proof.
        const m = v.matches[0];
        card.chain_commit = {
          tx_hash: m.tx_hash,
          explorer_url: m.explorer_url ?? null,
          block_number: m.block_number ?? null,
          committed_at: m.committed_at ?? null,
          signer_role: m.signer_role ?? 'facility',
          signer_address: m.signer_address ?? null,
          mocked: !!m.mocked,
          claim_hash,
        };

        // Local log may not have had block_number cached at commit time. Pull a
        // chain receipt to backfill if this isn't a mock tx.
        if (!card.chain_commit.block_number && !card.chain_commit.mocked
            && card.chain_commit.tx_hash) {
          try {
            const r = await fetch('/chain/' + card.chain_commit.tx_hash).then(r => r.json());
            if (r.verified && r.block_number) {
              card.chain_commit.block_number = r.block_number;
              card.chain_commit.signer_role = r.signer_role || card.chain_commit.signer_role;
              card.chain_commit.signer_address = r.signer_address || card.chain_commit.signer_address;
            }
          } catch (_) { /* RPC hiccup; poller will retry when startPolling fires */ }
        }
        // Mock tx → treat as already-final so the UI shows green immediately.
        if (card.chain_commit.mocked && !card.chain_commit.block_number) {
          card.chain_commit.block_number = 'mock';
        }
      } catch (_) {
        // Rehydration is best-effort; a failure just leaves the card as uncommitted.
      }
    },

    // ---- SPEND tab helpers (Dev A) ----
    spendOverall()   { return (this.spend.signals || []).find(c => c.signal_type === 'spend_overall'); },
    ownershipCard()  { return (this.spend.signals || []).find(c => c.signal_type === 'ownership_overlap'); },
    invoiceRows()    {
      const c = (this.spend.signals || []).find(c => c.signal_type === 'ref_price_delta');
      return c?.evidence?.line_items || [];
    },
    money(v) { return v >= 1 ? '$' + v.toFixed(2) : '$' + v.toFixed(4); },

    async loadStaffing() {
      if (!this.selected) return;
      const id = this.selected.id;
      try { const p = await fetch('/pbj/' + id).then(r => r.ok ? r.json() : null);
            if (this.selected?.id === id) this.staffing = p; } catch (_) { this.staffing = null; }
      try { const s = await fetch('/shift/' + id).then(r => r.json());
            if (this.selected?.id === id) this.shiftSignals = s.signals || []; } catch (_) { this.shiftSignals = []; }
    },

    async loadGuardianReports() {
      if (!this.selected) return;
      const id = this.selected.id;
      try { const r = await fetch('/care/reports?facility_id=' + id).then(r => r.json());
            if (this.selected?.id === id) this.guardianReports = r.reports || []; } catch (_) { this.guardianReports = []; }
    },

    shortHash(h) {
      if (!h) return '';
      return h.length > 14 ? h.slice(0, 8) + '…' + h.slice(-6) : h;
    },

    async canonicalHash(card) {
      const clean = Object.fromEntries(
        Object.entries(card).filter(([k]) => !k.startsWith('_') && k !== 'chain_commit')
      );
      const canon = JSON.stringify(sortedCopy(clean));
      const buf = new TextEncoder().encode(canon);
      const digest = await crypto.subtle.digest('SHA-256', buf);
      return '0x' + Array.from(new Uint8Array(digest))
        .map(b => b.toString(16).padStart(2, '0')).join('');
    },

    async commitCard(card) {
      if (card._committing || card.chain_commit) return;  // idempotent
      card._committing = true;
      try {
        const claim_hash = await this.canonicalHash(card);
        const tx = await fetch('/chain/commit', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ claim_type: 4, claim_hash }),
        }).then(r => r.json());
        card.chain_commit = {
          tx_hash: tx.tx_hash,
          explorer_url: tx.explorer_url,
          block_number: tx.block_number,   // null now; filled by poller when mined
          committed_at: tx.committed_at,
          signer_role: tx.signer_role,
          signer_address: tx.signer_address,
          mocked: tx.mocked,
          claim_hash,
        };
        // Mock txs skip the poller — the local service already treats them as final.
        if (tx.mocked) {
          card.chain_commit.block_number = 'mock';
        } else {
          this.startPolling(card);
        }
      } catch (e) {
        alert('Commit failed: ' + e.message);
      }
      card._committing = false;
    },

    startPolling(card) {
      const tx = card.chain_commit?.tx_hash;
      if (!tx || this._pollers[tx]) return;

      const poll = async () => {
        try {
          const r = await fetch('/chain/' + tx).then(r => r.json());
          card._verify = r;
          if (r.verified && r.block_number) {
            card.chain_commit.block_number = r.block_number;
            card.chain_commit.signer_role = r.signer_role || card.chain_commit.signer_role;
            card.chain_commit.signer_address = r.signer_address || card.chain_commit.signer_address;
            clearInterval(this._pollers[tx]);
            delete this._pollers[tx];
          }
        } catch (_) { /* transient; keep polling */ }
      };
      poll();                                                // kick immediately
      this._pollers[tx] = setInterval(poll, 3000);
    },

    async verifyCard(card) {
      if (!card.chain_commit?.tx_hash) return;
      try {
        card._verify = await fetch('/chain/' + card.chain_commit.tx_hash).then(r => r.json());
        if (card._verify.verified && card._verify.block_number) {
          card.chain_commit.block_number = card._verify.block_number;
        }
      } catch (e) {
        card._verify = { verified: false, source: 'error', note: e.message };
      }
    },

    async commitAllUnsigned() {
      const todo = this.spend.signals.filter(c => !c.chain_commit && !c._committing);
      if (!todo.length) return;
      this.batchCommitting = true;
      let n = 0;
      for (const c of todo) {
        n++;
        this.batchProgress = n + '/' + todo.length;
        await this.commitCard(c);   // signer lock serializes anyway — nonce-safe
      }
      this.batchCommitting = false;
      this.batchProgress = '';
    },

    async loadDeliveries(facilityId) {
      this.pos.loading = true;
      // Pre-fill form from the backend's current default rotation so the
      // staff sees the exact values that would be committed on submit.
      try {
        const def = await fetch('/delivery/defaults').then(r => r.json());
        this.pos.form.patient_pseudonym = def.patient_pseudonym || '';
        this.pos.form.staff_pseudonym   = def.staff_pseudonym   || '';
        this.pos.form.service_type      = def.service_type      || 'meal';
        this.pos.form.service_detail    = def.service_detail    || '';
      } catch (_) {}
      try {
        const r = await fetch('/deliveries?facility_id=' + encodeURIComponent(facilityId));
        if (r.ok) {
          this.pos.deliveries = await r.json();
          // Backfill block numbers for anything whose local log row was
          // written before the tx got mined. Each pending record gets the
          // same auto-polling treatment as a fresh upload.
          for (const d of this.pos.deliveries) {
            if (d.tx_hash && !d.block_number && !d.mocked) {
              this.pollDelivery(d);
            }
          }
        }
      } catch (_) {}
      this.pos.loading = false;
    },

    async refreshFormDefaults() {
      try {
        const def = await fetch('/delivery/defaults').then(r => r.json());
        this.pos.form.patient_pseudonym = def.patient_pseudonym || '';
        this.pos.form.staff_pseudonym   = def.staff_pseudonym   || '';
        this.pos.form.service_type      = def.service_type      || 'meal';
        this.pos.form.service_detail    = def.service_detail    || '';
      } catch (_) {}
    },

    async submitDelivery() {
      if (!this.selected) return;
      const fileEl = this.$refs.posFile;
      if (!fileEl || !fileEl.files || !fileEl.files[0]) {
        this.pos.error = 'pick a photo first';
        return;
      }
      this.pos.error = null;
      this.pos.uploading = true;
      try {
        const fd = new FormData();
        fd.append('facility_id', this.selected.id);
        fd.append('patient_pseudonym', this.pos.form.patient_pseudonym);
        fd.append('staff_pseudonym', this.pos.form.staff_pseudonym);
        fd.append('service_type', this.pos.form.service_type);
        fd.append('service_detail', this.pos.form.service_detail || '');
        fd.append('image', fileEl.files[0]);
        const r = await fetch('/delivery', { method: 'POST', body: fd });
        if (!r.ok) throw new Error(await r.text());
        const rec = await r.json();
        // Prepend so newest-first ordering holds.
        this.pos.deliveries = [rec, ...this.pos.deliveries];
        // Poll for block confirmation.
        this.pollDelivery(rec);
        // Reset form (pull a fresh rotation from the backend so the next
        // submission gets a new patient/service pair without reusing prior).
        fileEl.value = '';
        this.refreshFormDefaults();
      } catch (e) {
        this.pos.error = String(e.message || e).slice(0, 200);
      }
      this.pos.uploading = false;
    },

    pollDelivery(rec) {
      if (!rec.tx_hash || rec.block_number) return;
      const key = rec.tx_hash;
      if (this._pollers[key]) return;
      const poll = async () => {
        try {
          const r = await fetch('/chain/' + rec.tx_hash).then(r => r.json());
          if (r.verified && r.block_number) {
            rec.block_number = r.block_number;
            rec.signer_role = r.signer_role || rec.signer_role;
            rec.signer_address = r.signer_address || rec.signer_address;
            clearInterval(this._pollers[key]);
            delete this._pollers[key];
          }
        } catch (_) {}
      };
      poll();
      this._pollers[key] = setInterval(poll, 3000);
    },
  };
}

// Recursive key-sorted copy for canonical JSON hashing.
function sortedCopy(v) {
  if (Array.isArray(v)) return v.map(sortedCopy);
  if (v && typeof v === 'object') {
    const out = {};
    for (const k of Object.keys(v).sort()) out[k] = sortedCopy(v[k]);
    return out;
  }
  return v;
}
</script>
</body>
</html>
